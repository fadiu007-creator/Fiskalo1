name: Android POS CI

on:
  push:
    branches: [main, feature/web-pos-checkout]
    paths:
      - "mobile-pos/**"
      - ".github/workflows/android-pos.yml"
  pull_request:
    branches: [main, feature/web-pos-checkout]
    paths:
      - "mobile-pos/**"
      - ".github/workflows/android-pos.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit

  native-android-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Compile native Kotlin modules and assemble debug APK
        run: cd android && chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fiskalo-android-pos-debug-apk
          path: mobile-pos/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
