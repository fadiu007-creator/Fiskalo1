name: Android POS CI

on:
  push:
    branches: [main]
    paths:
      - "mobile-pos/**"
      - ".github/workflows/android-pos.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile-pos/**"
      - ".github/workflows/android-pos.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
