name: POS Agent CI

on:
  push:
    branches: [main]
    paths:
      - "pos-agent/**"
      - ".github/workflows/pos-agent.yml"
  pull_request:
    branches: [main]
    paths:
      - "pos-agent/**"
      - ".github/workflows/pos-agent.yml"

concurrency:
  group: pos-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build ATK protocol core
        run: dotnet build pos-agent/Fiskalo.PosAgent.Core/Fiskalo.PosAgent.Core.csproj --configuration Release
      - name: Build local POS Agent host
        run: dotnet build pos-agent/Fiskalo.PosAgent.Host/Fiskalo.PosAgent.Host.csproj --configuration Release
      - name: Run POS Agent tests
        run: dotnet test pos-agent/Fiskalo.PosAgent.Tests/Fiskalo.PosAgent.Tests.csproj --configuration Release
      - name: Validate Windows PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scripts = Get-ChildItem pos-agent/windows -Filter '*.ps1'
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
            }
          }

  publish-windows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained Windows POS Agent
        run: dotnet publish pos-agent/Fiskalo.PosAgent.Host/Fiskalo.PosAgent.Host.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true
      - name: Add Windows installer and launcher scripts
        shell: pwsh
        run: |
          $publish = 'pos-agent/Fiskalo.PosAgent.Host/bin/Release/net8.0/win-x64/publish'
          Copy-Item pos-agent/windows/Start-FiskaloPosAgent.ps1 $publish/
          Copy-Item pos-agent/windows/Install-FiskaloPosAgent.ps1 $publish/
          Copy-Item pos-agent/windows/Uninstall-FiskaloPosAgent.ps1 $publish/
      - name: Upload Windows POS Agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiskalo-pos-agent-win-x64
          path: pos-agent/Fiskalo.PosAgent.Host/bin/Release/net8.0/win-x64/publish/
          if-no-files-found: error
          retention-days: 14
